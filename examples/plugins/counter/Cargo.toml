# The Counter plugin's server code. Build it with `cargo plugin
# examples/plugins/counter` (from the repo), which puts server.wasm here.
[package]
name = "counter"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1.0.154"
wit-bindgen = "0.62"

# Not part of the app's workspace: it's built for WebAssembly on its own.
[workspace]
