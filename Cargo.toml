[workspace]
members = ["crates/protocol", "crates/server", "crates/overlay", "crates/panel", "crates/rain", "crates/alert", "crates/chat", "crates/obs", "crates/xtask", "crates/e2e"]
resolver = "3"

[workspace.package]
version = "0.3.1"
edition = "2024"
publish = false
license-file = "LICENSE.md"

# Backtraces keep file and line, without full debug info: smaller objects,
# faster links (an lsk rebuild 12.5 → 9.2 s), but a debugger shows no
# local variables. Comment it out for a debugging session.
[profile.dev]
debug = "line-tables-only"

# A debug server reads the pages it serves from disk on each request and
# hashes them (rust-embed): unoptimised, the panel's 20 MB .wasm took
# 0.7 s, over 3 s with four e2e tests at once.
[profile.dev.package.sha2]
opt-level = 3

# Plugins' server code is compiled by wasmtime's Cranelift when it starts:
# unoptimised, OBS's took 1.0 s (2 to 3 s with four e2e tests at once),
# optimised 0.1 s (77 ms in release). Changing these rebuilds wasmtime
# and the app, about 2 minutes.
[profile.dev.package.cranelift-codegen]
opt-level = 3
[profile.dev.package.cranelift-assembler-x64]
opt-level = 3
[profile.dev.package.cranelift-frontend]
opt-level = 3
[profile.dev.package.cranelift-entity]
opt-level = 3
[profile.dev.package.cranelift-bforest]
opt-level = 3
[profile.dev.package.cranelift-bitset]
opt-level = 3
[profile.dev.package.cranelift-control]
opt-level = 3
[profile.dev.package.cranelift-codegen-shared]
opt-level = 3
[profile.dev.package.regalloc2]
opt-level = 3
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3
[profile.dev.package.wasmtime-environ]
opt-level = 3
[profile.dev.package.wasmparser]
opt-level = 3

[workspace.dependencies]
protocol = { path = "crates/protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# twitch_api's hype train v2 types (PR #536) are merged but not released
# yet. Its twitch_oauth2 and twitch_types are submodules of the same
# repository, so all three come from there, or we'd have two copies of each.
[patch.crates-io]
twitch_api = { git = "https://github.com/twitch-rs/twitch_api", rev = "62e4c626644496bd619f7b58565e5d1cd8e243aa" }
twitch_oauth2 = { git = "https://github.com/twitch-rs/twitch_api", rev = "62e4c626644496bd619f7b58565e5d1cd8e243aa" }
twitch_types = { git = "https://github.com/twitch-rs/twitch_api", rev = "62e4c626644496bd619f7b58565e5d1cd8e243aa" }
