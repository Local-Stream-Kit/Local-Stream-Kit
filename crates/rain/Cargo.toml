[package]
name = "rain"
description = "The built-in Rain plugin's overlay page: emote rain with rapier2d physics, Rust compiled to WebAssembly"
version.workspace = true
edition.workspace = true
publish.workspace = true
license-file.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]   # cdylib is what trunk / wasm-bindgen need

[dependencies]
protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3.106", features = [
    "Window", "Document", "Node", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlImageElement",
    "CanvasRenderingContext2d", "CssStyleDeclaration", "console", "MessageEvent", "Response", "Headers",
    "ImageBitmap", "ImageDecoder", "ImageDecoderInit", "ImageDecodeOptions", "ImageDecodeResult",
    "ImageTrackList", "ImageTrack", "VideoFrame",
] }
rapier2d = "0.36"   # default features; not `parallel` (no threads in the browser)
console_error_panic_hook = "0.1"
