<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Show media</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    /* Placed by its centre; `--tilt` is its rotation. */
    .item {
      position: absolute;
      transform: translate(-50%, -50%) rotate(var(--tilt, 0deg));
      display: block;
    }
    .item.in-pop { animation: pop-in 0.45s cubic-bezier(0.2, 1.6, 0.4, 1) both; }
    .item.out-pop { animation: pop-out 0.35s ease-in both; }
    .item.in-fade { animation: fade-in 0.4s ease-out both; }
    .item.out-fade { animation: fade-in 0.4s ease-in reverse both; }
    .item.in-slide_up { animation: slide-up 0.5s ease-out both; }
    .item.out-slide_up { animation: slide-up 0.4s ease-in reverse both; }
    .item.in-slide_down { animation: slide-down 0.5s ease-out both; }
    .item.out-slide_down { animation: slide-down 0.4s ease-in reverse both; }
    @keyframes pop-in {
      from { transform: translate(-50%, -50%) rotate(var(--tilt, 0deg)) scale(0); }
      to { transform: translate(-50%, -50%) rotate(var(--tilt, 0deg)) scale(1); }
    }
    @keyframes pop-out {
      from { transform: translate(-50%, -50%) rotate(var(--tilt, 0deg)) scale(1); opacity: 1; }
      to { transform: translate(-50%, -50%) rotate(var(--tilt, 0deg)) scale(0); opacity: 0; }
    }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slide-up {
      from { transform: translate(-50%, calc(-50% + 100vh)) rotate(var(--tilt, 0deg)); }
      to { transform: translate(-50%, -50%) rotate(var(--tilt, 0deg)); }
    }
    @keyframes slide-down {
      from { transform: translate(-50%, calc(-50% - 100vh)) rotate(var(--tilt, 0deg)); }
      to { transform: translate(-50%, -50%) rotate(var(--tilt, 0deg)); }
    }
  </style>
</head>
<body>
  <script src="media.js"></script>
</body>
</html>
