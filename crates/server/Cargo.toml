[package]
name = "lsk"
description = "Turns what happens on a Twitch stream into effects on an OBS overlay"
version.workspace = true
edition.workspace = true
publish.workspace = true
license-file.workspace = true

[features]
# Builds the Stream Deck plugin's file into the exe, for Status's Install
# (`cargo dist` turns it on). build.rs says where the file is taken from,
# and reads the plugin's version from its manifest.
streamdeck = ["dep:serde_json"]

[dependencies]
protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.53", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
rust-embed = { version = "8.13", features = ["mime-guess"] }
reqwest = { version = "0.13", features = ["json"] }
anyhow = "1"
thiserror = "2"
rand = "0.10"
futures-util = "0.3"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.6", features = ["derive"] }
# `beta`: Warn Chat User (its endpoints only; guest star events too).
twitch_api = { version = "0.8", features = ["beta", "eventsub", "helix", "reqwest"] }
twitch_oauth2 = { version = "0.17", features = ["reqwest"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
tokio-rustls = { version = "0.26", default-features = false }
rustls-native-certs = "0.8"
sha2 = "0.10"
ring = "0.17.14"
semver = "1.0.28"
misaki-rs = { version = "0.6.0", default-features = false }
zip = { version = "9.0.0", default-features = false, features = ["deflate"] }
ort-sys = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "disable-linking"] }
open = "5.3"
mime_guess = "2"
wasmtime = { version = "49", default-features = false, features = ["anyhow", "cranelift", "component-model", "runtime", "std", "parallel-compilation"] }
wasmtime-wasi = { version = "49.0.2", default-features = false, features = ["p2"] }

[build-dependencies]
# Reads the Stream Deck plugin's version from its manifest (the feature).
serde_json = { workspace = true, optional = true }
