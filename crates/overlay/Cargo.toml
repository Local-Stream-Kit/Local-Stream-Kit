[package]
name = "overlay"
description = "The Local Stream Kit overlay: Rust compiled to WebAssembly, shown in an OBS Browser Source"
version.workspace = true
edition.workspace = true
publish.workspace = true
license-file.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]   # cdylib is what trunk / wasm-bindgen need

[dependencies]
protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3.106", features = [
    "Window", "Document", "NodeList", "Location", "UrlSearchParams", "console",
    "WebSocket", "MessageEvent", "CloseEvent", "Event", "HtmlIFrameElement",
] }
console_error_panic_hook = "0.1"
