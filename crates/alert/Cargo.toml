[package]
name = "alert"
description = "The built-in Alerts plugin's overlay page: styled alerts with a sound and a spoken message, Rust compiled to WebAssembly"
version.workspace = true
edition.workspace = true
publish.workspace = true
license-file.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]   # cdylib is what trunk / wasm-bindgen need

[dependencies]
protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3.106", features = [
    "Window", "Document", "Node", "Element", "HtmlElement", "HtmlImageElement", "HtmlAudioElement",
    "HtmlMediaElement", "MediaError", "HtmlHeadElement", "DomTokenList", "MessageEvent", "console",
] }
console_error_panic_hook = "0.1"
