<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Chat display</title>
  <script>
    // The overlay sends the plugin's settings (and what the page kept) as
    // soon as this page has loaded, before its WebAssembly has started:
    // messages wait here until it has (lib.rs takes them).
    window.chatWaiting = [];
    window.chatEarly = (event) => window.chatWaiting.push(event);
    addEventListener("message", window.chatEarly);
  </script>
  <!-- Release builds run wasm-opt at level 2 (speed), as the overlay does. -->
  <link data-trunk rel="rust" data-wasm-opt="2" />
  <!-- The structure under the streamer's CSS. No integrity check: in its
       sandbox the page's origin is opaque, so the stylesheet is a
       cross-origin (no-cors) request, which a check would block. -->
  <link data-trunk rel="css" href="chat-base.css" data-integrity="none" />
  <!-- The built-in looks (the plugin's `look` setting's `starts`), and its
       help page. -->
  <link data-trunk rel="copy-dir" href="looks" />
  <link data-trunk rel="copy-file" href="help.html" />
  <style>
    /* Transparent, so only the chat composites into OBS. */
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }
  </style>
  <!-- The look: the plugin's `look` setting's picked CSS, filled in by lib.rs. -->
  <style id="look"></style>
</head>
<body>
  <div class="chat" id="chat"></div>
</body>
</html>
