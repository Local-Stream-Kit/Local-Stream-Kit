[package]
name = "chat"
description = "The built-in Chat display plugin's overlay page: chat messages in the streamer's CSS, Rust compiled to WebAssembly"
version.workspace = true
edition.workspace = true
publish.workspace = true
license-file.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]   # cdylib is what trunk / wasm-bindgen need

[dependencies]
protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3.106", features = [
    "Window", "Document", "Node", "Element", "HtmlElement", "HtmlTemplateElement", "DocumentFragment",
    "DomTokenList", "CssStyleDeclaration", "MessageEvent", "HtmlHeadElement", "console",
] }
console_error_panic_hook = "0.1"
