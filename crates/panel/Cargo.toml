[package]
name = "panel"
description = "The Local Stream Kit control panel: Yew (Rust compiled to WebAssembly), served at /panel/"
version.workspace = true
edition.workspace = true
publish.workspace = true
license-file.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]   # cdylib is what trunk / wasm-bindgen need
doctest = false   # it has none; rustdoc starting up for nothing cost seconds per test run

[dependencies]
protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
yew = { version = "0.23", features = ["csr"] }
gloo = "0.11"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3.106", features = [
    "Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlSelectElement",
    "HtmlTextAreaElement", "WebSocket", "MessageEvent", "CloseEvent", "Location", "DomRect",
    "PointerEvent", "WheelEvent", "KeyboardEvent", "MouseEvent", "EventTarget", "Navigator",
    "Clipboard", "ClipboardEvent", "DataTransfer", "DragEvent", "Node", "DomStringList", "File", "FileList", "Blob", "HtmlHeadElement", "HtmlIFrameElement", "HtmlAudioElement", "HtmlMediaElement", "ResizeObserver", "CssStyleDeclaration", "console",
    "Event", "EventInit", "FocusOptions", "HtmlCollection", "HtmlOptionElement", "HtmlOptionsCollection",
    "MutationObserver", "MutationObserverInit", "ScrollIntoViewOptions", "ScrollLogicalPosition",
] }
console_error_panic_hook = "0.1"
